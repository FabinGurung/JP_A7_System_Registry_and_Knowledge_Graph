name: A7 Registry Validation

on:
  push:
    branches:
      - main
      - "feature/a7-*"
      - "closeout/a7-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical A7 registry
        run: python scripts/validate_registry.py
      - name: Validate authority and provider contracts
        run: python scripts/validate_authority.py
      - name: Test deterministic authority resolver
        run: python scripts/test_authority_resolver.py
      - name: Validate GitHub repository / Pages / workflow inventory
        run: python scripts/validate_github_inventory.py
      - name: Validate Google Drive topology contract
        run: python scripts/validate_drive_topology.py
      - name: Validate research routing and governance boundary
        run: python scripts/validate_research_governance.py
      - name: Validate specialist module bindings and ownership boundaries
        run: python scripts/validate_module_boundaries.py
      - name: Validate cross-repository module manifest contract
        run: python scripts/validate_module_manifests.py
      - name: Confirm relational contract exists
        run: test -f relational/a7-schema.postgresql.sql
      - name: Confirm generated directory is explicitly non-authoritative
        run: grep -q "derived and non-authoritative" generated/README.md
