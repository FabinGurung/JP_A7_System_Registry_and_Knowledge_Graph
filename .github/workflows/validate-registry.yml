name: A7 Registry Validation

on:
  push:
    branches:
      - main
      - "feature/a7-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical A7 registry
        run: python scripts/validate_registry.py

      - name: Confirm Phase-1 relational contract exists
        run: test -f relational/a7-schema.postgresql.sql

      - name: Confirm generated directory is explicitly non-authoritative
        run: grep -q "derived and non-authoritative" generated/README.md
