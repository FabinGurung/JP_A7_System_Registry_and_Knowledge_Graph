name: A7 Registry Validation

on:
  push:
    branches:
      - main
      - "feature/a7-*"
      - "closeout/a7-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical A7 registry
        run: python scripts/validate_registry.py
      - name: Validate authority and provider contracts
        run: python scripts/validate_authority.py
      - name: Test deterministic authority resolver
        run: python scripts/test_authority_resolver.py
      - name: Validate GitHub repository / Pages / workflow inventory
        run: python scripts/validate_github_inventory.py
      - name: Validate Google Drive topology contract
        run: python scripts/validate_drive_topology.py
      - name: Validate research routing and governance boundary
        run: python scripts/validate_research_governance.py
      - name: Validate specialist module bindings and ownership boundaries
        run: python scripts/validate_module_boundaries.py
      - name: Validate cross-repository module manifest contract
        run: python scripts/validate_module_manifests.py
      - name: Validate deterministic project-module routing
        run: python scripts/validate_project_module_bindings.py
      - name: Generate visualization derivation test artifact
        run: python scripts/generate_visualizations.py --output-dir .a7-generated-test --commit-sha "$GITHUB_SHA"
      - name: Validate visualization derivation
        run: python scripts/validate_visualizations.py --data-dir .a7-generated-test
      - name: Validate pinned visualization strategy
        run: python scripts/validate_visualization_workspace.py --data-dir .a7-generated-test
      - name: Validate A7 and R&D coordination roadmap
        run: python scripts/validate_roadmap.py
      - name: Validate A7 sky mist site theme
        run: python scripts/validate_site_theme.py
      - name: Validate public-safe control tower navigation
        run: python scripts/validate_control_tower_map.py
      - name: Validate versioned AI-aided product guide and nine-repository survey
        run: python scripts/validate_ai_aided_product_guide.py
      - name: Validate first-phase Galactic Atlas as read-only cross-module projection
        run: |
          python scripts/validate_galactic_atlas.py
          python scripts/generate_galactic_atlas.py --output .a7-generated-test/galactic-atlas.json --commit-sha "$GITHUB_SHA"
          test -s .a7-generated-test/galactic-atlas.json
      - name: Validate Arc 02 provider-derived Galaxy inspector
        run: |
          python scripts/validate_galactic_atlas_arc02.py
          node --check site/assets/galactic-atlas.js
      - name: Validate Arc 03 derived Galaxy sectors and navigation
        run: |
          python scripts/validate_galactic_atlas_arc03.py
          node --check site/assets/galactic-atlas.js
      - name: Validate Arc 04 evidence-gated interstellar routes
        run: |
          python scripts/validate_galactic_atlas_arc04.py
          node --check site/assets/galactic-atlas-arc04.js
      - name: Validate Arc 06 source-linked world flight deck
        run: |
          python scripts/validate_galactic_atlas_arc06.py
          node --check site/assets/galactic-atlas-arc06.js
      - name: Validate Arc 05 immutable release constellations
        run: |
          python scripts/validate_galactic_atlas_arc05.py
          node --check site/assets/galactic-atlas-arc05.js
      - name: Validate private bridge public-safe status and historical hold
        run: python scripts/validate_private_bridge_boundary.py
      - name: Validate L0 homepage and L1 A7 Git development history
        run: |
          python scripts/generate_a7_development_history.py --output .a7-generated-test/development-history.json --offline
          python scripts/validate_a7_development_history.py --data-dir .a7-generated-test
          node --check site/assets/development-history.js
      - name: Validate cross-provider source and artifact lineage contract
        run: python scripts/validate_artifact_lineage_contract.py
      - name: Validate domain-guide ownership and dated provider status
        run: python scripts/validate_repository_health.py
      - name: Validate A7-only governance debt boundaries
        run: python scripts/validate_a7_governance_debt.py
      - name: Validate A7 L1 source-derived roadmap
        run: |
          python scripts/validate_a7_roadmap.py
          node --check site/assets/a7-roadmap.js
      - name: Validate source-pinned A7 dock and curated platform Memory Wall
        run: |
          python scripts/validate_developer_dock_platform_board.py
          node --check site/assets/a7-developer-dock.js
          node --check site/assets/platform-responsibilities.js
      - name: Validate source-curated interface vocabulary and preserved posters
        run: |
          python scripts/validate_memory_ui_vocabulary.py
          node --check site/assets/memory-ui-vocabulary.js
      - name: Validate Arc 07 source-governed public Resource Navigator
        run: |
          python scripts/validate_resource_navigator.py
          python scripts/generate_resource_navigator.py --output .a7-generated-test/resource-navigator.json --commit-sha "$GITHUB_SHA"
          node --check site/assets/resource-navigator.js
      - name: Validate printable, non-authoritative Memory Wall posters
        run: python scripts/validate_memory_wall.py
      - name: Validate unified site theme and decorative rocket
        run: python scripts/validate_unified_theme.py
      - name: Validate unified navigation, preserved history and six Memory Wall techniques
        run: |
          python scripts/validate_site_navigation.py
          node --check site/assets/a7-site-shell.js
          node --check site/assets/memory-visualization.js
      - name: Confirm relational contract exists
        run: test -f relational/a7-schema.postgresql.sql
      - name: Confirm generated directory is explicitly non-authoritative
        run: grep -q "derived and non-authoritative" generated/README.md
