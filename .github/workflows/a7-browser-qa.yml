name: A7 real-browser Galactic Atlas QA
on:
  push:
    branches:
      - main
      - "feature/a7-*"
      - "closeout/a7-*"
    paths:
      - "site/**"
      - "scripts/a7_browser_qa.cjs"
      - "registry/curations/memory-ui-vocabulary.v0.1.json"
      - "registry/curations/memory-storage-architecture.v0.1.json"
      - "scripts/generate_memory_storage_architecture.py"
      - "scripts/validate_memory_storage_architecture.py"
      - "registry/curations/resource-navigator.v0.1.json"
      - "scripts/generate_resource_navigator.py"
      - "scripts/validate_resource_navigator.py"
      - "scripts/generate_memory_ui_vocabulary.py"
      - "scripts/validate_memory_ui_vocabulary.py"
      - "registry/curations/platform-responsibilities.v0.1.json"
      - "scripts/generate_platform_responsibilities.py"
      - "scripts/validate_developer_dock_platform_board.py"
      - "scripts/validate_galactic_atlas_arc06.py"
      - "scripts/generate_galactic_atlas.py"
      - "registry/decisions/galactic-atlas-*"
      - "registry/edges/edges.jsonl"
      - ".github/workflows/a7-browser-qa.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build source-derived Arc04 projection
        run: |
          python scripts/generate_galactic_atlas.py --output site/data/galactic-atlas.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_galactic_atlas_arc04.py
          node --check site/assets/galactic-atlas.js
          node --check site/assets/galactic-atlas-arc04.js
      - name: Generate A7-only Git development timeline offline
        run: |
          python scripts/generate_a7_development_history.py --output site/data/development-history.json --offline
          python scripts/validate_a7_development_history.py --data-dir site/data
          node --check site/assets/development-history.js
      - name: Derive A7-only progress fixtures
        run: |
          python scripts/generate_a7_roadmap.py --output site/data/a7-roadmap.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_a7_roadmap.py
      - name: Derive source-verified dock and platform map QA fixtures
        run: |
          python scripts/generate_a7_developer_dock.py --output site/data/a7-developer-dock.json --commit-sha "$GITHUB_SHA"
          python scripts/generate_platform_responsibilities.py --output site/data/platform-responsibilities.json --commit-sha "$GITHUB_SHA"
          python scripts/generate_memory_wall.py --output site/data/memory-posters.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_memory_wall.py
          python scripts/validate_developer_dock_platform_board.py
      - name: Build interface vocabulary gallery fixture
        run: |
          python scripts/generate_memory_ui_vocabulary.py --output site/data/memory-ui-vocabulary.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_memory_ui_vocabulary.py
      - name: Build storage-only Memory Wall poster fixture
        run: |
          python scripts/generate_memory_storage_architecture.py --output site/data/memory-storage-architecture.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_memory_storage_architecture.py
          node --check site/assets/memory-storage-architecture.js
      - name: Derive public Arc07 navigation fixture
        run: |
          python scripts/generate_resource_navigator.py --output site/data/resource-navigator.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_resource_navigator.py
          node --check site/assets/resource-navigator.js
      - name: Install isolated Chromium for browser and viewport checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise desktop, mobile, filters, selected-route evidence and reduced motion
        run: node scripts/a7_browser_qa.cjs
      - name: Preserve screenshot and assertion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a7-browser-qa-${{ github.run_id }}
          path: browser-qa-output/
          retention-days: 14
          if-no-files-found: warn
