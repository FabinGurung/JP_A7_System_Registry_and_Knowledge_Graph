name: A7 Pages Visualization

on:
  push:
    branches:
      - main
    paths:
      - "A7_BOOTSTRAP.json"
      - "registry/**"
      - "scripts/generate_visualizations.py"
      - "scripts/validate_visualizations.py"
      - "scripts/resolve_project_semantic_id.py"
      - "scripts/test_project_semantic_id.py"
      - "scripts/validate_project_module_bindings.py"
      - "scripts/generate_galactic_atlas.py"
      - "scripts/validate_galactic_atlas.py"
      - "scripts/validate_galactic_atlas_arc02.py"
      - "scripts/validate_galactic_atlas_arc03.py"
      - "scripts/validate_galactic_atlas_arc04.py"
      - "scripts/validate_galactic_atlas_arc05.py"
      - "scripts/validate_galactic_atlas_arc06.py"
      - "scripts/validate_artifact_lineage_contract.py"
      - "scripts/validate_private_bridge_boundary.py"
      - "scripts/generate_a7_development_history.py"
      - "scripts/generate_a7_roadmap.py"
      - "scripts/validate_a7_roadmap.py"
      - "scripts/validate_jp_roadmap_version_control.py"
      - "scripts/validate_a7_governance_debt.py"
      - "scripts/generate_a7_developer_dock.py"
      - "scripts/generate_platform_responsibilities.py"
      - "scripts/validate_developer_dock_platform_board.py"
      - "scripts/validate_a7_development_history.py"
      - "registry/contracts/source-artifact-lineage.v0.1.json"
      - "registry/lineage/public-pages-release.example.json"
      - "scripts/generate_repository_health.py"
      - "scripts/validate_repository_health.py"
      - "scripts/generate_memory_wall.py"
      - "scripts/validate_memory_wall.py"
      - "scripts/generate_memory_ui_vocabulary.py"
      - "scripts/validate_memory_ui_vocabulary.py"
      - "scripts/generate_memory_storage_architecture.py"
      - "scripts/validate_memory_storage_architecture.py"
      - "scripts/generate_memory_extraction_guidance.py"
      - "scripts/validate_memory_extraction_guidance.py"
      - "scripts/validate_memory_wall_published_site.py"
      - "scripts/generate_resource_navigator.py"
      - "scripts/validate_resource_navigator.py"
      - "site/**"
      - ".github/workflows/deploy-a7-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: a7-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate semantic project identity redirects
        run: |
          python scripts/validate_project_module_bindings.py
          python scripts/test_project_semantic_id.py
      - name: Generate A7 projections
        run: python scripts/generate_visualizations.py --output-dir site/data --commit-sha "$GITHUB_SHA"
      - name: Validate generated projections
        run: python scripts/validate_visualizations.py --data-dir site/data
      - name: Generate derived Galactic Atlas directory
        run: python scripts/generate_galactic_atlas.py --output site/data/galactic-atlas.json --commit-sha "$GITHUB_SHA"
      - name: Validate non-authoritative Galactic Atlas and legacy preservation
        run: |
          python scripts/validate_galactic_atlas.py
          test -s site/data/galactic-atlas.json
      - name: Validate Arc 02 selected-world provenance and deployment gates
        run: |
          python scripts/validate_galactic_atlas_arc02.py
          node --check site/assets/galactic-atlas.js
      - name: Validate Arc 03 sector taxonomy and filtered star navigation
        run: |
          python scripts/validate_galactic_atlas_arc03.py
          node --check site/assets/galactic-atlas.js
      - name: Validate Arc 04 evidence-gated routes and script
        run: |
          python scripts/validate_galactic_atlas_arc04.py
          node --check site/assets/galactic-atlas-arc04.js
      - name: Validate Arc 05 immutable history and script
        run: |
          python scripts/validate_galactic_atlas_arc05.py
          node --check site/assets/galactic-atlas-arc05.js
      - name: Validate Arc 06 source-linked world flight deck
        run: |
          python scripts/validate_galactic_atlas_arc06.py
          node --check site/assets/galactic-atlas-arc06.js
      - name: Validate private bridge public boundary
        run: python scripts/validate_private_bridge_boundary.py
      - name: Validate cross-provider artifact lineage contract
        run: python scripts/validate_artifact_lineage_contract.py
      - name: Generate dated repository health projection
        run: python scripts/generate_repository_health.py --output site/data/repository-health.json --commit-sha "$GITHUB_SHA"
      - name: Validate dated health and guide ownership
        run: python scripts/validate_repository_health.py
      - name: Validate A7 release governance debt boundary
        run: python scripts/validate_a7_governance_debt.py
      - name: Validate JP single-live-roadmap archival governance
        run: python scripts/validate_jp_roadmap_version_control.py
      - name: Rebuild A7 progress from canonical registry
        run: |
          python scripts/generate_a7_roadmap.py --output site/data/a7-roadmap.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_a7_roadmap.py
          node --check site/assets/a7-roadmap.js
      - name: Build verified source paths and curated platform Memory Wall
        run: |
          python scripts/generate_a7_developer_dock.py --output site/data/a7-developer-dock.json --commit-sha "$GITHUB_SHA"
          python scripts/generate_platform_responsibilities.py --output site/data/platform-responsibilities.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_developer_dock_platform_board.py
          node --check site/assets/a7-developer-dock.js
          node --check site/assets/platform-responsibilities.js
      - name: Build human UI vocabulary Memory Wall collection
        run: |
          python scripts/generate_memory_ui_vocabulary.py --output site/data/memory-ui-vocabulary.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_memory_ui_vocabulary.py
          node --check site/assets/memory-ui-vocabulary.js
      - name: Build storage-only architecture poster source
        run: |
          python scripts/generate_memory_storage_architecture.py --output site/data/memory-storage-architecture.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_memory_storage_architecture.py
          node --check site/assets/memory-storage-architecture.js
      - name: Build six-collection contents and source-extraction guidance
        run: |
          python scripts/generate_memory_extraction_guidance.py --output-dir site/data --commit-sha "$GITHUB_SHA"
          python scripts/validate_memory_extraction_guidance.py
          node --check site/assets/memory-wall-guides.js
      - name: Build safe Resource Navigator reference projection
        run: |
          python scripts/generate_resource_navigator.py --output site/data/resource-navigator.json --commit-sha "$GITHUB_SHA"
          python scripts/validate_resource_navigator.py
          node --check site/assets/resource-navigator.js
      - name: Derive public reference posters from machine curation
        run: python scripts/generate_memory_wall.py --output site/data/memory-posters.json --commit-sha "$GITHUB_SHA"
      - name: Validate Memory Wall design and curation
        run: python scripts/validate_memory_wall.py
      - name: Generate bounded owner Git commits + provider-backed PR/Actions history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/generate_a7_development_history.py --output site/data/development-history.json --require-provider
          python scripts/validate_a7_development_history.py --data-dir site/data
          node --check site/assets/development-history.js
      - name: Verify published static site has six clickable TOC links and generated JSON
        run: |
          python scripts/validate_memory_wall_published_site.py --site-root site --data-dir site/data --commit-sha "$GITHUB_SHA"
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
