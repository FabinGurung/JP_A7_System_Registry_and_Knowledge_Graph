name: A7 Pages Visualization

on:
  push:
    branches:
      - main
    paths:
      - "A7_BOOTSTRAP.json"
      - "registry/**"
      - "scripts/generate_visualizations.py"
      - "scripts/validate_visualizations.py"
      - "site/**"
      - ".github/workflows/deploy-a7-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: a7-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate A7 projections
        run: python scripts/generate_visualizations.py --output-dir site/data --commit-sha "$GITHUB_SHA"
      - name: Validate generated projections
        run: python scripts/validate_visualizations.py --data-dir site/data
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
