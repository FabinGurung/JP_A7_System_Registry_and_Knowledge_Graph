name: A7 GitHub-to-Main Library Bridge Dry Run
on:
  workflow_dispatch:
  push:
    paths:
      - "registry/bridges/github-heads-20261009.json"
      - "scripts/build_main_library_bridge.py"
      - ".github/workflows/main-library-bridge-dryrun.yml"
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Produce schema-aligned non-mutating candidates
        run: python3 scripts/build_main_library_bridge.py --out build/main-library-candidates
      - name: Upload public-safe bridge candidates
        uses: actions/upload-artifact@v4
        with:
          name: github-main-library-candidates
          path: build/main-library-candidates/
          retention-days: 7
